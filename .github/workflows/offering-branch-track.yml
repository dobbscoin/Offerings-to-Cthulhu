name: Track main on the offering branch

# Keeps feat/issue-8-mining-tab-solo — the standalone opt-in "offering" build
# lineage (Mining tab + in-wallet stratum) — riding on top of main without
# ever merging into it. On every push to main:
#
#   1. rebase the offering branch onto the new main (force-with-lease)
#   2. stamp a wallet-mining-<main-sha> tag on the rebased head
#   3. dispatch the three build workflows at that tag, because tags pushed
#      with GITHUB_TOKEN do not fire tag-triggered workflows on their own
#
# Result: every advance of main automatically yields fresh Win64/Linux
# artifacts equal to "current main + the miner commits", with provenance in
# the tag name. If the rebase ever conflicts, the run fails and a comment is
# posted on issue #8 for a human to resolve — pushes to main are never
# blocked by this workflow.
#
# Maintenance rule for the offering branch: it is rebased-and-force-pushed by
# this workflow. Never commit to it without pulling/rebasing first.

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: offering-branch-track
  cancel-in-progress: false

env:
  OFFERING_BRANCH: feat/issue-8-mining-tab-solo

jobs:
  rebase-tag-dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout offering branch (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OFFERING_BRANCH }}
          fetch-depth: 0

      - name: Rebase onto main
        id: rebase
        run: |
          git config user.name "MWOWM"
          git config user.email "mwowm@subgenius.net"
          git fetch origin main
          echo "mainsha=$(git rev-parse --short origin/main)" >> "$GITHUB_OUTPUT"
          git rebase origin/main

      - name: Push branch and build tag
        id: tag
        run: |
          TAG="wallet-mining-${{ steps.rebase.outputs.mainsha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git push --force-with-lease origin "$OFFERING_BRANCH"
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"

      - name: Dispatch build workflows at the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in linux-build-depends.yml linux-qt5-build-depends.yml windows-build-depends.yml; do
            gh workflow run "$wf" --ref "${{ steps.tag.outputs.tag }}" -R "$GITHUB_REPOSITORY"
          done
          echo "Dispatched builds at ${{ steps.tag.outputs.tag }}"

      - name: Prune superseded wallet-mining draft releases
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_NEWEST: "3"
          PROTECTED_TAGS: "wallet-mining-ef3672f"
        run: |
          # One draft accumulates per push to main. They are never published --
          # the offering build ships as an unlisted zip, not a GitHub release --
          # so without this the releases page fills up with dead drafts.
          #
          # Only DRAFT releases tagged wallet-mining-* are considered, and git
          # tags are deliberately left intact (no --cleanup-tag): any pruned
          # build can be regenerated by re-dispatching the builds at its tag.
          set -uo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == true and (.tag_name | startswith("wallet-mining-"))) | "\(.created_at)\t\(.tag_name)"' \
            | sort -r | cut -f2 > /tmp/drafts.txt || exit 0
          echo "wallet-mining drafts present: $(wc -l < /tmp/drafts.txt) (keeping newest $KEEP_NEWEST)"
          tail -n +$((KEEP_NEWEST + 1)) /tmp/drafts.txt | while read -r tag; do
            [ -n "$tag" ] || continue
            case " $PROTECTED_TAGS " in *" $tag "*) echo "  protected, keeping $tag"; continue ;; esac
            echo "  pruning $tag"
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes || echo "  (delete failed for $tag, ignored)"
          done

      - name: Flag rebase conflict on issue 8
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 8 -R "$GITHUB_REPOSITORY" --body \
            "Automatic rebase of \`$OFFERING_BRANCH\` onto main failed for \
          ${{ github.sha }} — manual rebase needed before the next offering build. \
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
